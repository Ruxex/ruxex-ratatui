name: Publish to crates.io

on:
  push:
    tags:
      - 'ruxex-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packaging without publishing
        required: true
        default: true
        type: boolean
      skip_published_dependencies:
        description: Skip dependency packages already published for this release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate workspace and first registry package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          cargo check --workspace --locked
          cargo publish -p ruxex-ratatui-widgets --locked --dry-run

      - name: Check crates.io token
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Publish ratatui-core
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-core --locked

      - name: Allow the crates.io index to update after ratatui-core
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        run: sleep 30

      - name: Publish ratatui-crossterm
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-crossterm --locked

      - name: Allow the crates.io index to update
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        run: sleep 30

      - name: Publish ratatui-widgets
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-widgets --locked

      - name: Allow the crates.io index to update after ratatui-widgets
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        run: sleep 30

      - name: Publish ratatui-macros
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-macros --locked

      - name: Allow the crates.io index to update after ratatui-macros
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        run: sleep 30

      - name: Publish ratatui-termina
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-termina --locked

      - name: Publish ratatui-termion
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-termion --locked

      - name: Publish ratatui-termwiz
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui-termwiz --locked

      - name: Allow the crates.io index to update after backends
        if: github.event_name == 'push' || (inputs.dry_run == false && inputs.skip_published_dependencies != true)
        run: sleep 30

      - name: Publish ratatui
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ruxex-ratatui --locked
