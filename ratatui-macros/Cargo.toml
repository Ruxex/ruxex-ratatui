[package]
name = "ruxex-ratatui-macros"
version = "0.7.2"
description = "Macros for Ratatui"
edition.workspace = true
license = "MIT"
repository.workspace = true
documentation = "https://docs.rs/ruxex-ratatui-macros"
keywords = ["macros", "ratatui", "tui", "ui"]
